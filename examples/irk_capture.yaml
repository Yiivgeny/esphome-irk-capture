esphome:
  name: irk-capture-dev
  friendly_name: IRK Capture Dev

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:

api:
  # Home Assistant event calls require "Allow the device to perform Home Assistant actions"
  # to be enabled for this device in the ESPHome integration options.

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/Yiivgeny/esphome-irk-capture
      ref: main
    components: [irk_capture]

text_sensor:
  - platform: template
    name: "Last IRK"
    id: last_irk_text
    icon: "mdi:key-wireless"
    update_interval: never

esp32_ble:
  id: ble_core
  name: "irk"
  io_capability: none
  auth_req_mode: sc_bond
  max_connections: 1

esp32_ble_server:
  id: ble_server
  manufacturer: "ESPHome"
  model: "IRK Capture"
  appearance: 0x4142
  max_clients: 1

irk_capture:
  id: irk_capture_component
  ble_id: ble_core
  ble_server_id: ble_server
  visible_switch:
    name: "BLE Visible"
  enroll_switch:
    name: "BLE Enroll"
  on_irk:
    then:
      - text_sensor.template.publish:
          id: last_irk_text
          state: !lambda "return irk;"
      - homeassistant.event:
          event: esphome.irk_captured
          data_template:
            irk: "{{ irk_value }}"
            mac: "{{ mac_value }}"
          variables:
            irk_value: !lambda "return irk;"
            mac_value: !lambda "return address;"
      - logger.log:
          format: "Discovered IRK %s for %s"
          args:
            - irk.c_str()
            - address.c_str()
