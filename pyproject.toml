[project]
name = "esphome-irk-capture"
version = "0.1.0"
description = "ESPHome external component for capturing BLE Identity Resolving Keys (IRKs)."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "esphome~=2026.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.9,<0.12.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.ruff]
target-version = "py312"
line-length = 100
